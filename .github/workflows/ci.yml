name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  api:
    name: api · type-check · lint · test
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://crisismap:crisismap@localhost:5432/crisismap
      API_PORT: "4000"
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: crisismap
          POSTGRES_PASSWORD: crisismap
          POSTGRES_DB: crisismap
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        run: npm run prisma:generate

      - name: Run migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Type check
        working-directory: apps/api
        run: npm run type-check

      - name: Lint
        working-directory: apps/api
        run: npm run lint

      - name: Unit tests
        working-directory: apps/api
        run: npm test

      - name: E2E tests
        working-directory: apps/api
        run: npm run test:e2e

  web:
    name: web · type-check · lint · test · build
    runs-on: ubuntu-latest
    needs: api

    env:
      DATABASE_URL: postgresql://crisismap:crisismap@localhost:5432/crisismap
      REDIS_URL: redis://localhost:6379
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: crisismap-reports
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
      STORAGE_PUBLIC_URL: http://localhost:9000/crisismap-reports
      LIBRETRANSLATE_URL: http://localhost:5000
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@crisismap.local
      NEXTAUTH_SECRET: ci-secret-not-used-in-tests-xxxxxxxx
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: test

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: crisismap
          POSTGRES_PASSWORD: crisismap
          POSTGRES_DB: crisismap
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Type check
        working-directory: apps/web
        run: npm run type-check

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Test
        working-directory: apps/web
        run: npm run test

      - name: Accessibility tests
        working-directory: apps/web
        run: npm run test:a11y

      - name: Build
        working-directory: apps/web
        env:
          NODE_ENV: production
        run: npm run build
