name: Release Please

# Runs on every push to main. release-please reads conventional commits
# and opens/updates a "Release PR" automatically. Merging that PR creates
# the GitHub Release + git tag. No manual tagging needed.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Reads release-please-config.json + .release-please-manifest.json
          # from the repo root for monorepo package configuration.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
