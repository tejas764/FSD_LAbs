        features:
          type: array
          items:
            $ref: '#/components/schemas/CrisisFootprintFeatureDto'
        metadata:
          $ref: '#/components/schemas/CrisisFootprintMetadataDto'
      required:
        - type
        - features
    HotspotDto:
