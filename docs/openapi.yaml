      required:
        - type
        - count
    RecentReportDto:
      type: object
      properties:
        id:
          type: string
        submittedAt:
          type: string
        damageLevel:
          type: string
        infraType:
          type: string
        locationText:
          type: string
          nullable: true
      required:
