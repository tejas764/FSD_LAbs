<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640" role="img" aria-label="Illustrative close-up mobile view showing NDRF rescue boat operation and field responder deploying in flood-affected area. For demonstration purposes only.">
  <title>ResQNet Illustrative Rescue Operation — Mobile Close-Up View</title>
  <desc>An illustrative portrait-orientation close-up of an NDRF rescue boat in a flooded street, field responders in emergency gear, and incident status overlay. All content is for demonstration purposes and does not represent real emergency conditions.</desc>
  <defs>
    <linearGradient id="water-m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#075985" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0C4A6E" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="sky-m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <linearGradient id="boat-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <radialGradient id="searchlight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky / Background -->
  <rect width="480" height="640" fill="url(#sky-m)"/>

  <!-- Dramatic cloud detail -->
  <ellipse cx="100" cy="80" rx="140" ry="55" fill="#1E3A5F" opacity="0.6"/>
  <ellipse cx="380" cy="50" rx="120" ry="45" fill="#172554" opacity="0.7"/>
  <ellipse cx="250" cy="120" rx="200" ry="60" fill="#1E293B" opacity="0.5"/>

  <!-- Rain lines (storm effect) -->
  <g stroke="#38BDF8" stroke-width="0.5" opacity="0.2">
    <line x1="50"  y1="0"  x2="30"  y2="200"/>
    <line x1="120" y1="0"  x2="100" y2="200"/>
    <line x1="200" y1="0"  x2="180" y2="200"/>
    <line x1="280" y1="0"  x2="260" y2="200"/>
    <line x1="360" y1="0"  x2="340" y2="200"/>
    <line x1="440" y1="0"  x2="420" y2="200"/>
  </g>

  <!-- Flooded buildings (background, partially submerged) -->
  <rect x="0"   y="200" width="90"  height="260" fill="#0F172A" opacity="0.9"/>
  <rect x="95"  y="230" width="80"  height="230" fill="#0B1120" opacity="0.9"/>
  <rect x="300" y="210" width="85"  height="250" fill="#0F172A" opacity="0.9"/>
  <rect x="390" y="250" width="90"  height="210" fill="#0B1120" opacity="0.9"/>

  <!-- Building windows (lit) -->
  <rect x="15"  y="210" width="18" height="12" rx="2" fill="#FCD34D" opacity="0.8"/>
  <rect x="45"  y="210" width="18" height="12" rx="2" fill="#FCD34D" opacity="0.5"/>
  <rect x="15"  y="235" width="18" height="12" rx="2" fill="#FCD34D" opacity="0.3"/>
  <rect x="310" y="225" width="18" height="12" rx="2" fill="#FCD34D" opacity="0.7"/>
  <rect x="345" y="225" width="18" height="12" rx="2" fill="#FCD34D" opacity="0.4"/>
  <rect x="405" y="260" width="18" height="12" rx="2" fill="#FCD34D" opacity="0.6"/>

  <!-- SOS signal from rooftop -->
  <text x="30" y="195" fill="#EF4444" font-size="16" font-weight="bold" font-family="monospace" text-anchor="middle">SOS</text>
  <circle cx="30" cy="185" r="18" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.7"/>

  <!-- Flood water surface -->
  <path d="M 0,370 Q 120,355 240,368 Q 360,380 480,362 L480,640 L0,640 Z" fill="url(#water-m)"/>
  <path d="M 0,382 Q 80,374 160,380 Q 240,386 320,375 Q 400,364 480,372 L480,640 L0,640 Z" fill="#0369A1" opacity="0.4"/>

  <!-- Water ripples -->
  <ellipse cx="240" cy="395" rx="180" ry="8" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.3"/>
  <ellipse cx="240" cy="410" rx="220" ry="10" fill="none" stroke="#38BDF8" stroke-width="0.8" opacity="0.2"/>

  <!-- RESCUE BOAT -->
  <!-- Hull -->
  <path d="M 80,370 Q 90,395 110,400 L 370,400 Q 390,395 400,370 Z" fill="url(#boat-g)" stroke="#6B7280" stroke-width="1.5"/>
  <!-- Boat body -->
  <rect x="100" y="345" width="280" height="55" rx="8" fill="#374151" stroke="#4B5563" stroke-width="1"/>
  <!-- Boat railing -->
  <line x1="100" y1="345" x2="380" y2="345" stroke="#6B7280" stroke-width="2"/>
  <!-- Orange inflatable side -->
  <rect x="92" y="358" width="296" height="22" rx="10" fill="#EA580C" stroke="#FB923C" stroke-width="1" opacity="0.9"/>

  <!-- NDRF marking on boat -->
  <text x="240" y="376" fill="white" font-size="13" font-weight="900" font-family="monospace" text-anchor="middle" letter-spacing="2">NDRF</text>
  <text x="240" y="358" fill="#FCD34D" font-size="8" font-family="monospace" text-anchor="middle" font-weight="bold">🛡 NATIONAL DISASTER RESPONSE</text>

  <!-- Responders on boat (silhouettes) -->
  <!-- Responder 1 -->
  <circle cx="150" cy="330" r="14" fill="#1E40AF"/>
  <rect x="140" y="344" width="22" height="28" rx="4" fill="#1E40AF"/>
  <text x="150" y="338" fill="white" font-size="10" text-anchor="middle">👷</text>

  <!-- Responder 2 -->
  <circle cx="240" cy="328" r="14" fill="#166534"/>
  <rect x="230" y="342" width="22" height="28" rx="4" fill="#166534"/>
  <text x="240" y="336" fill="white" font-size="10" text-anchor="middle">👷</text>

  <!-- Responder 3 -->
  <circle cx="330" cy="330" r="14" fill="#1E40AF"/>
  <rect x="320" y="344" width="22" height="28" rx="4" fill="#1E40AF"/>
  <text x="330" y="338" fill="white" font-size="10" text-anchor="middle">👷</text>

  <!-- Searchlight beam -->
  <path d="M 240,320 L 60,520 L 100,520 Z" fill="url(#searchlight)" opacity="0.4"/>

  <!-- ── STATUS OVERLAY PANEL ── -->
  <rect x="10" y="10" width="460" height="90" rx="10" fill="rgba(0,0,0,0.78)"/>
  <rect x="10" y="10" width="460" height="90" rx="10" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.7"/>

  <!-- Critical badge -->
  <rect x="20" y="20" width="80" height="20" rx="10" fill="#7F1D1D"/>
  <text x="60" y="34" fill="#FCA5A5" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">◆ CRITICAL</text>

  <text x="20" y="58" fill="white" font-size="12" font-weight="bold" font-family="monospace">INC-2024-0047 — SWIFT WATER RESCUE</text>
  <text x="20" y="74" fill="#93C5FD" font-size="9" font-family="monospace">📍 Sector 4 Embankment  |  16.5125°N 80.6420°E</text>
  <text x="20" y="90" fill="#6EE7B7" font-size="9" font-family="monospace">👥 165 civilians stranded  |  🛡 NDRF-1 on scene</text>

  <!-- ONLINE badge -->
  <rect x="380" y="20" width="82" height="20" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="421" y="34" fill="#34D399" font-size="9" font-weight="bold" font-family="monospace" text-anchor="middle">● ONLINE</text>

  <!-- ── BOTTOM STATUS BAR ── -->
  <rect x="0" y="600" width="480" height="40" rx="0" fill="rgba(0,0,0,0.85)"/>
  <text x="240" y="617" fill="#94A3B8" font-size="8" font-family="monospace" text-anchor="middle">ResQNet — OFFLINE-FIRST DISASTER COORDINATION</text>
  <text x="240" y="632" fill="#475569" font-size="7" font-family="monospace" text-anchor="middle">⚠ ILLUSTRATIVE — NOT live emergency data  |  CSC413-8 Lab 2</text>
</svg>

