<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#grad)" />
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="#3B82F6" stroke-width="4" stroke-opacity="0.4" />
  <!-- Radar circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="6,6" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.3" />
  <!-- Medical / Rescue Cross Symbol with Shield -->
  <path d="M256 90 L390 145 V265 C390 355 256 425 256 425 C256 425 122 355 122 265 V145 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="10" filter="url(#glow)"/>
  <!-- Bold Red & White Rescue Cross -->
  <path d="M230 170 H282 V226 H338 V278 H282 V334 H230 V278 H174 V226 H230 Z" fill="#EF4444" stroke="#FFFFFF" stroke-width="4" />
  <!-- Signal Pulse Nodes -->
  <circle cx="256" cy="252" r="14" fill="#FFFFFF" />
  <circle cx="256" cy="252" r="6" fill="#DC2626" />
  <!-- Offline-First Sync arrows around base -->
  <path d="M190 370 A80 80 0 0 0 322 370" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round" />
  <polygon points="328,364 322,378 314,366" fill="#10B981" />
</svg>

